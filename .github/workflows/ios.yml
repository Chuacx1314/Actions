name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  SCHEME: SideVault
  PROJECT: App/SideVault.xcodeproj
  BUNDLE_ID: dev.chuacx.sidevault

jobs:
  # Stage 1: always runnable.
  # The Xcode part is gated on App/project.yml (XcodeGen spec); CryptoCore tests are gated on
  # CryptoCore/Package.swift. Until those land the job is a green toolchain check.
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pin Xcode and print diagnostics
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | sed -n '1,40p'
          swift --version
          fastlane --version | head -2

      - name: Crypto core tests (SwiftPM, no simulator, no signing)
        if: "hashFiles('CryptoCore/Package.swift') != ''"
        working-directory: CryptoCore
        run: |
          set -o pipefail
          swift test --parallel

      - name: PC-side interop vectors (Node, optional)
        if: "hashFiles('tools/interop/package.json') != ''"
        working-directory: tools/interop
        run: |
          set -o pipefail
          npm ci
          npm test

      - name: Nothing to build yet (info only)
        if: "hashFiles('App/project.yml') == ''"
        run: echo "::notice::App/project.yml not found - skipping XcodeGen, build and IPA steps"

      # xcodegen is NOT preinstalled on the macos-26 image (checked against the image readme);
      # Homebrew 6.0.18 is, so install the bottle on demand.
      - name: Ensure xcodegen
        if: "hashFiles('App/project.yml') != ''"
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        if: "hashFiles('App/project.yml') != ''"
        run: |
          set -euo pipefail
          xcodegen generate --spec App/project.yml --project App
          ls -la App

      # Fail fast on the three settings that otherwise explode half way through the build.
      - name: Assert project settings
        if: "hashFiles('App/project.yml') != ''"
        run: |
          set -euo pipefail
          test -f "App/SideVault.xcodeproj/xcshareddata/xcschemes/$SCHEME.xcscheme" \
            || { echo "::error::scheme $SCHEME is not shared (xcshareddata/xcschemes missing)"; exit 1; }

          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -showBuildSettings \
            > "$RUNNER_TEMP/bs.txt" 2>&1 || { tail -40 "$RUNNER_TEMP/bs.txt"; exit 1; }

          grep -qE '^ *IPHONEOS_DEPLOYMENT_TARGET = 17\.0$' "$RUNNER_TEMP/bs.txt" \
            || { echo "::error::IPHONEOS_DEPLOYMENT_TARGET is not 17.0"; exit 1; }
          grep -qE '^ *SWIFT_VERSION = 5(\.0)?$' "$RUNNER_TEMP/bs.txt" \
            || { echo "::error::SWIFT_VERSION is not 5.0"; exit 1; }
          grep -qE "^ *PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID\$" "$RUNNER_TEMP/bs.txt" \
            || { echo "::error::PRODUCT_BUNDLE_IDENTIFIER is not $BUNDLE_ID"; exit 1; }
          echo "::notice::deployment target, Swift version and bundle id all verified"

      - name: Build unsigned .app for device
        if: "hashFiles('App/project.yml') != ''"
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build | xcbeautify

      - name: Package unsigned IPA and verify it
        if: "hashFiles('App/project.yml') != ''"
        run: |
          set -euo pipefail
          APP=$(ls -d build/dd/Build/Products/Release-iphoneos/*.app | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")

          # Guard 1: refuse to ship a simulator slice - SideStore rejects it.
          xcrun vtool -show-build "$APP/$EXE" | grep -q 'platform IOS' \
            || { echo "::error::artifact is not an iOS device build"; exit 1; }

          # Guard 2: install target must match - an app with MinimumOSVersion 26.0
          # silently refuses to install on an older phone.
          MINOS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          [ "$MINOS" = "17.0" ] || { echo "::error::MinimumOSVersion=$MINOS, expected 17.0"; exit 1; }

          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          [ "$BUNDLE" = "$BUNDLE_ID" ] || { echo "::error::unexpected bundle id $BUNDLE"; exit 1; }

          rm -rf dist Payload && mkdir -p dist Payload
          cp -R "$APP" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload dist/SideVault-unsigned.ipa
          unzip -l dist/SideVault-unsigned.ipa | head -5

      - uses: actions/upload-artifact@v4
        if: "hashFiles('App/project.yml') != ''"
        with:
          name: SideVault-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30

  # Stage 3, paid Apple Developer Program only. Manual trigger, disabled by default.
  # Secrets: ASC_KEY_P8 (base64 of AuthKey_XXX.p8), ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID
  # Vars:    ENABLE_TESTFLIGHT=true
  testflight:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.ENABLE_TESTFLIGHT == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pin Xcode
        run: sudo xcode-select -s "$XCODE_APP" && xcodebuild -version

      - name: Ensure xcodegen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec App/project.yml --project App

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=$RUNNER_TEMP/AuthKey.p8"
            echo "APP_STORE_CONNECT_API_KEY_KEY_ID=${{ secrets.ASC_KEY_ID }}"
            echo "APP_STORE_CONNECT_API_KEY_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }}"
          } >> "$GITHUB_ENV"

      # fastlane/ExportOptions.plist is committed with a __TEAM_ID__ placeholder;
      # render it into $RUNNER_TEMP so the team id never lands in the repo.
      - name: Render ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [ -n "$TEAM_ID" ] || { echo "::error::secret APPLE_TEAM_ID is not set"; exit 1; }
          sed "s/__TEAM_ID__/$TEAM_ID/" fastlane/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          grep -q "$TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SideVault.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            archive | xcbeautify

      - name: Export signed IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/SideVault.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath dist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          fastlane pilot upload \
            --ipa dist/SideVault.ipa \
            --skip_waiting_for_build_processing true
